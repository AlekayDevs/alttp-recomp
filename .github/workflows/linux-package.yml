# Construye el paquete de Linux (scripts/release.sh) en Ubuntu 22.04, con glibc 2.35, para que el ejecutable abra en más
# distribuciones que si se compila en una máquina reciente (el de Ubuntu 24.04 pide glibc 2.39). Se lanza a mano:
#   gh workflow run linux-package.yml   (la versión sale del fichero VERSION)
# Deja el .tar.gz y SHA256SUMS como artefacto de la ejecución. NO publica ninguna release: eso lo decide una persona.
# No lleva la ROM ni nada derivado de ella (release.sh comprueba el contenido del paquete).
name: Paquete de Linux

on:
  workflow_dispatch:

jobs:
  paquete:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write      # la attestation se firma con la identidad del workflow (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Versión (fichero VERSION)
        id: v
        run: echo "version=$(head -n1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # release.sh busca el motor en ../snes-recomp y TinyCC (rama mob, sin configurar) en ../tinycc
      - name: Motor y TinyCC
        run: |
          # el motor es el commit de ENGINE_VERSION (el mismo del alttp-recomp.exe de Windows), no el HEAD de hoy
          git clone https://github.com/ArgoxDevs/snes-recomp ../snes-recomp
          git -C ../snes-recomp checkout "$(sed -n 's/^commit=//p' ENGINE_VERSION | tr -d '[:space:]')"
          git clone https://github.com/TinyCC/tinycc ../tinycc
          git -C ../tinycc checkout e23dabed

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config

      - name: Construir el paquete
        run: scripts/release.sh "${{ steps.v.outputs.version }}"

      - name: SHA256SUMS y versión de glibc que pide
        run: |
          scripts/sums.sh
          for f in out/release/*/alttp-recomp out/release/*/lib/*.so*; do
            echo "$f: $(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done

      # firma de procedencia (GitHub artifact attestations): quien baje el paquete puede comprobar que salió de este workflow y de
      # este commit con `gh attestation verify <fichero> -R ArgoxDevs/alttp-recomp`. Atestiguamos el paquete y SHA256SUMS.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/release/*.tar.gz
            out/release/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: alttp-recomp-${{ steps.v.outputs.version }}-linux-x86_64
          path: |
            out/release/*.tar.gz
            out/release/SHA256SUMS
          if-no-files-found: error
